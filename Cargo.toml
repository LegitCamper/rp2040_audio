[package]
name = "rp2040-audio-tx"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
default = ["rp2040"]
rp2040 = ["embassy-rp/rp2040"]
rp2350 = ["embassy-rp/rp235xa"]
rx-diagnostic = []
rx-stream = ["rx-diagnostic"]
rx-hop = ["rx-stream"]

[dependencies]
embassy-futures = { path = "../embassy-cyw43-iso/embassy-futures" }
cyw43 = { path = "../embassy-cyw43-iso/cyw43", features = ["bluetooth-iso", "defmt"] }
cyw43-pio = { path = "../embassy-cyw43-iso/cyw43-pio" }
embassy-rp = { path = "../embassy-cyw43-iso/embassy-rp", features = ["time-driver", "critical-section-impl"] }
embassy-executor = { path = "../embassy-cyw43-iso/embassy-executor", features = ["arch-cortex-m", "executor-thread"] }
embassy-time = { path = "../embassy-cyw43-iso/embassy-time", features = ["defmt-timestamp-uptime"] }
bt-hci = "0.11"
defmt = "1"
defmt-rtt = { version = "1", features = ["disable-blocking-mode"] }
panic-probe = { version = "1", features = ["print-defmt"] }
cortex-m-rt = "0.7"
static_cell = "2"
portable-atomic = { version = "1", features = ["critical-section"] }

[profile.release]
opt-level = "s"
debug = 2
lto = true
codegen-units = 1
