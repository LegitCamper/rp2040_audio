[package]
name = "rp2040-audio-tx"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
default = ["rp2040"]
rp2040 = ["embassy-rp/rp2040"]
rp2350 = ["embassy-rp/rp235xa"]
rx-diagnostic = []
rx-stream = ["rx-diagnostic"]
rx-hop = ["rx-stream"]
rx-timer-hop = ["rx-stream"]

[dependencies]
embassy-futures = { git = "https://github.com/LegitCamper/embassy", rev = "0b278a1f23810069b9b4ecb733e4d7744a30bacb" }
cyw43 = { git = "https://github.com/LegitCamper/embassy", rev = "0b278a1f23810069b9b4ecb733e4d7744a30bacb", features = ["bluetooth-iso", "defmt"] }
cyw43-pio = { git = "https://github.com/LegitCamper/embassy", rev = "0b278a1f23810069b9b4ecb733e4d7744a30bacb" }
cyw43-firmware = { git = "https://github.com/LegitCamper/embassy", rev = "0b278a1f23810069b9b4ecb733e4d7744a30bacb" }
embassy-rp = { git = "https://github.com/LegitCamper/embassy", rev = "0b278a1f23810069b9b4ecb733e4d7744a30bacb", features = ["time-driver", "critical-section-impl"] }
embassy-executor = { git = "https://github.com/LegitCamper/embassy", rev = "0b278a1f23810069b9b4ecb733e4d7744a30bacb", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { git = "https://github.com/LegitCamper/embassy", rev = "0b278a1f23810069b9b4ecb733e4d7744a30bacb", features = ["defmt-timestamp-uptime"] }
bt-hci = "0.11"
defmt = "1"
defmt-rtt = { version = "1", features = ["disable-blocking-mode"] }
panic-probe = { version = "1", features = ["print-defmt"] }
cortex-m-rt = "0.7"
static_cell = "2"
portable-atomic = { version = "1", features = ["critical-section"] }

[profile.release]
opt-level = "s"
debug = 2
lto = true
codegen-units = 1
